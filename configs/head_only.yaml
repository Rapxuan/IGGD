# Frozen-backbone FiLM baseline; separate from the full fine-tuning config.
model:
  backbone: "google/siglip2-base-patch16-256"
  freeze: true
  image_size: 256
  patch_size: 16
  visual_dim: 768
  text_dim: 768
  text_length: 64
  channels: 128
  fusion: "film"

dataset:
  max_boxes: 16
  num_workers: 2

train:
  epochs: 500
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  save_every: 50

eval:
  top_k: 5
  iou_threshold: 0.25
  angle_tolerance_deg: 30.0
